<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Classroom</title>
<link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">
<style>
body { font-family: 'Anta', sans-serif; background: #000; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
canvas { position: fixed; top:0; left:0; z-index:-1; }

/* Rounded Topbar */
.topbar {
  position: fixed;
  top: 15px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.85);
  display: flex; align-items: center; justify-content: center;
  gap: 1.5rem;
  padding: 0.6rem 1.5rem;
  border: 1px solid #00ccff;
  border-radius: 30px;
  box-shadow: 0 0 10px rgba(0,204,255,0.6);
  z-index: 1000;
}
.topbar a {
  color: #00ccff;
  text-decoration: none;
  font-size: 1rem;
  transition: color 0.2s;
}
.topbar a:hover { color: #ffcc00; }

/* Shift header down so it doesn’t overlap */
header { 
  text-align: center; 
  padding: 6rem 2rem 2rem; 
}
header h1 { margin-bottom: 0.5rem; color: #00ccff; }
header p { margin-bottom: 1rem; }

#searchBox { 
  padding: 10px; border-radius: 5px; border: none; 
  font-family: 'Anta', sans-serif; 
  width: 250px; margin-bottom: 2rem; 
}

.games-grid { 
  display: flex; flex-wrap: wrap; 
  justify-content: center; gap: 20px; 
  padding: 0 2rem 4rem; 
}

.game-card { 
  width: 200px; background: rgba(0,0,0,0.7); 
  padding: 1rem; border-radius: 12px; 
  cursor: pointer; display: flex; flex-direction: column; 
  align-items: center; text-align: center; 
  transition: transform 0.2s, background 0.2s, border 0.2s; 
  border: 1px solid #222; 
}
.game-card img { width: 100%; border-radius: 8px; margin-bottom: 0.5rem; transition: transform 0.2s; }
.game-card:hover img { transform: scale(1.05); }
.game-card:hover { background: rgba(0,50,100,0.7); border-color: #00ccff; }
.game-title { color: #00ccff; font-size: 1.2rem; }
.game-title:hover { color: #ffcc00; }
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<!-- Rounded Topbar -->
<div class="topbar">
  <a href="index.html">Home</a>
  <a href="change.html">Changelog</a>
</div>

<header>
  <h1>Specter ɢᴀᴍᴇꜱ | New ɢᴀᴍᴇꜱ everyday! ❤️</h1>
  <p>If you get caught using this website during school hours, it's not my responsibility. Click a ɢᴀᴍᴇ to open it!</p>
  <p>Every ɢᴀᴍᴇ is tested before it is added.</p>
  <input type="text" id="searchBox" placeholder="Search games...">
</header>

<div class="games-grid" id="gamesList">
  <!-- (your game cards stay the same) -->
</div>

<script>
// Site-wide shutdown check
function checkShutdown() {
  fetch('/shutdown.json')
    .then(r => r.json())
    .then(data => {
      if(data.shutdown) {
        document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;color:#ff4444'>" + data.message + "</h1>";
      }
    })
    .catch(console.error);
}
checkShutdown();
setInterval(checkShutdown, 5000);

// Star Canvas
const canvas = document.getElementById("starCanvas");
const ctx = canvas.getContext("2d");
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener("resize",resizeCanvas); resizeCanvas();
const stars=[]; for(let i=0;i<150;i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,radius:Math.random()*5,dx:(Math.random()-0.5)*0.5,dy:(Math.random()-0.5)*0.5});}
function drawStars(){ctx.fillStyle="#001133";ctx.fillRect(0,0,canvas.width,canvas.height); stars.forEach(star=>{ctx.beginPath();ctx.arc(star.x,star.y,star.radius,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();star.x+=star.dx;star.y+=star.dy;if(star.x<0||star.x>canvas.width) star.dx*=-1;if(star.y<0||star.y>canvas.height) star.dy*=-1;}); requestAnimationFrame(drawStars);}
drawStars();

// Open games in new pages
const gameCards = document.querySelectorAll('.game-card');
gameCards.forEach(card=>{card.addEventListener('click',()=>{window.location.href = `${card.dataset.folder}/index.html`;});});

// Search bar
const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input',()=>{
  const filter = searchBox.value.toLowerCase();
  gameCards.forEach(card=>{const title = card.querySelector('.game-title').textContent.toLowerCase(); card.style.display = title.includes(filter)?'flex':'none';});
});
</script>

</body>
</html>
