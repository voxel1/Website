<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Specter Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Anta', sans-serif; background:#000; color:#fff; margin:0; padding:0; overflow-x:hidden; }
    canvas { position:fixed; top:0; left:0; z-index:-1; }
    .topbar {
      position: fixed; top:0; left:0; right:0; height:50px;
      background: rgba(0,0,0,0.85);
      display: flex; align-items:center; justify-content:center; gap:2rem;
      border-bottom:1px solid #00ccff; z-index:1000;
    }
    .topbar a { color:#00ccff; text-decoration:none; transition:0.2s; }
    .topbar a:hover { color:#ffcc00; }
    header { text-align:center; padding:4rem 2rem 2rem; }
    header h1 { color:#00ccff; }
    .settings-box {
      max-width:600px; margin:2rem auto; padding:2rem;
      background:rgba(0,0,0,0.7); border:1px solid #00ccff;
      border-radius:12px;
    }
    .settings-box h2 { color:#ffcc00; margin-bottom:1rem; }
    .setting { margin-bottom:1rem; }
    label { margin-left:0.5rem; }
  </style>
</head>
<body>
<canvas id="starCanvas"></canvas>

<div class="topbar">
  <a href="index.html">Home</a>
  <a href="change.html">Changelog</a>
  <a href="settings.html">Settings</a>
</div>

<header>
  <h1>⚙️ Settings</h1>
  <p>Customize your experience on Specter Games</p>
</header>

<div class="settings-box">
  <h2>Preferences</h2>
  <div class="setting">
    <input type="checkbox" id="music">
    <label for="music">Enable Background Music</label>
  </div>
  <div class="setting">
    <input type="checkbox" id="animations" checked>
    <label for="animations">Enable Animations</label>
  </div>
  <div class="setting">
    <input type="checkbox" id="stars" checked>
    <label for="stars">Show Star Background</label>
  </div>
</div>

<script>
// Star background
const canvas=document.getElementById("starCanvas"),ctx=canvas.getContext("2d");
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener("resize",resizeCanvas);resizeCanvas();
const stars=[];for(let i=0;i<150;i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,radius:Math.random()*5,dx:(Math.random()-0.5)*0.5,dy:(Math.random()-0.5)*0.5});}
function drawStars(){ctx.fillStyle="#001133";ctx.fillRect(0,0,canvas.width,canvas.height);stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();s.x+=s.dx;s.y+=s.dy;if(s.x<0||s.x>canvas.width)s.dx*=-1;if(s.y<0||s.y>canvas.height)s.dy*=-1;});requestAnimationFrame(drawStars);}
drawStars();
</script>
</body>
</html>
