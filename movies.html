<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specter Movies</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
}
/* Top Bar */
header {
  background: rgba(20, 20, 20, 0.95);
  padding: 15px 30px;
  margin: 20px auto;
  width: 90%;
  max-width: 1200px;
  border-radius: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
header h1 { font-size: 24px; color: #00ccff; margin: 0; }
header nav a {
  color: #fff;
  margin-left: 20px;
  text-decoration: none;
  transition: color 0.3s;
}
header nav a:hover { color: #00ccff; }

/* Info Section */
.info {
  margin: 20px auto;
  width: 90%;
  max-width: 1000px;
  font-size: 16px;
  color: #ccc;
}

/* Movies Grid */
.movie-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin: 40px auto;
  width: 90%;
  max-width: 1200px;
}
.movie-card {
  background: rgba(30, 30, 30, 0.9);
  border-radius: 15px;
  padding: 15px;
  width: 220px;
  text-align: center;
  transition: transform 0.3s, box-shadow 0.3s;
  cursor: pointer;
}
.movie-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
}
.movie-card img { width: 100%; border-radius: 10px; }
.movie-card h3 { margin: 10px 0 0; font-size: 18px; color: #00ccff; }

/* Footer */
footer {
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  font-size: 14px;
  color: #aaa;
}
footer a { color: #aaa; text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Specter Movies</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="changelog.html">Changelog</a>
  </nav>
</header>

<div class="info">
  <p>Welcome to Specter Movies! Click a poster to watch a movie.</p>
</div>

<div class="movie-grid">
  <!-- Placeholder Movie -->
  <div class="movie-card" onclick="window.location.href='movie1.html';">
    <img src="https://via.placeholder.com/220x330.png?text=Sample+Movie" alt="Sample Movie">
    <h3>Sample Movie</h3>
  </div>
</div>

<footer>
  <p>© Specter Games 2025</p>
  <p>Don't want your movie on the website? Contact us at 
    <a href="mailto:specterubg@gmail.com">specterubg@gmail.com</a>
  </p>
</footer>

</body>
</html>
